name: Daily sheet to website
on:
  push:
    branches: [main]
  # Once daily at 12:17 KST, allowing time for morning collection.
  # This is a daily snapshot, not a collector-completion event.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    if: (github.event_name != 'schedule' || vars.DAILY_SHEET_SYNC_ENABLED == 'true') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poster validation tools
        run: python -m pip install Pillow==11.3.0 pypdfium2==4.30.0
      - name: Test data preservation and poster failure handling
        run: |
          node --test tests/*.test.cjs tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Read public columns and validate
        id: sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          POSTER_REPORT: reports/posters.json
        run: node scripts/sync-sheet.mjs
      - name: Retain poster diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-report
          path: reports/posters.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save only validated public files
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- growing-dot-upload/snapshot.js growing-dot-upload/index.html growing-dot-upload/posters/
          git commit -m 'Update public contest snapshot from source sheet'
          git push origin HEAD:main
      - name: Record publication revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: sync
    # Re-publish even unchanged data: recover a previous deployment failure and
    # publish app-only changes without requiring another sheet edit.
    if: needs.sync.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.revision }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: growing-dot-upload
      # GITHUB_TOKEN pushes don't trigger the other push workflow, so deploy here.
      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment
        env:
          REVISION: ${{ needs.sync.outputs.revision }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## Pages 배포 완료\n커밋: `%s`\n\n홈페이지: %s\n' "$REVISION" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

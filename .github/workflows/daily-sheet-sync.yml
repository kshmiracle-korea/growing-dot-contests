name: Daily sheet to website
on:
  # Once daily at 12:17 KST, allowing time for morning collection.
  # This is a daily snapshot, not a collector-completion event.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    if: (github.event_name == 'workflow_dispatch' || vars.DAILY_SHEET_SYNC_ENABLED == 'true') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public columns and validate
        id: sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-sheet.mjs
      - name: Save only validated public files
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- growing-dot-upload/snapshot.js growing-dot-upload/index.html
          git commit -m 'Update public contest snapshot from source sheet'
          git push origin HEAD:main
      - name: Record publication revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.revision }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: growing-dot-upload
      # GITHUB_TOKEN pushes don't trigger the other push workflow, so deploy here.
      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
